      <div class="user-chip"><div class="avatar">AF</div>Ali Farooq</div>
    </div>
    <div class="content">
      
<form id="dispute-form">
<div class="card" style="max-width:600px;">
  <h3>Dispute a block</h3>
  <div id="dispute-error" class="notice" style="background:var(--danger-soft); color:var(--danger-text); display:none; margin-bottom:14px;"></div>
  <div class="field"><label>Blocked device</label><select name="deviceId" id="dispute-device-select" required></select></div>
  <div class="field"><label>Why do you believe this block is incorrect?</label><textarea rows="4" name="reason" required maxlength="1000" placeholder="Describe what happened"></textarea></div>
  <div class="field"><label>Supporting evidence (optional)</label><input type="file"></div>
  <button type="submit" class="btn btn-accent">Submit Dispute</button>
  <p style="font-size:11px; margin-top:10px;">Your dispute is routed to a Support Agent's case queue and logged in the tamper-evident audit trail.</p>
</div>
</form>
